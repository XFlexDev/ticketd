[package]
name = "ticketd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "webp", "bmp", "tiff", "jpeg", "gif"] }
sha2 = "0.10"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.9"
poise = "0.7.1"
reqwest = { version = "0.13.5", features = ["form", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
reqwest12 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", features = ["rustls_backend", "collector"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
feed-rs = "2"
regex = "1.13.1"
songbird = { version = "0.6", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
async-trait = "0.1.92"
